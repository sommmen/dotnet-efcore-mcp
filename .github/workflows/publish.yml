# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: Publish a stable release to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  publish:
    name: Pack and Publish (.NET)
    runs-on: windows-latest
    # step-level `if:` conditions cannot reference the `secrets` context directly, so the
    # presence of this optional secret is surfaced via a job-level env var instead (see
    # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts).
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Restore dependencies
        run: dotnet restore dotnet-efcore-mcp.slnx

      - name: Build
        run: dotnet build dotnet-efcore-mcp.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test dotnet-efcore-mcp.slnx --no-build --no-restore --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack dotnet-efcore-mcp.slnx --no-build --no-restore --configuration Release --output ./artifacts

      - name: Publish to GitHub Packages
        run: |
          foreach ($file in (Get-ChildItem ./artifacts -Recurse -Filter *.nupkg)) {
            dotnet nuget push $file.FullName `
              --source https://nuget.pkg.github.com/sommmen/index.json `
              --api-key "${{ github.token }}" `
              --skip-duplicate `
              --no-symbols
          }

      # The npm package (./npm) is a launcher that installs the matching NuGet tool version at
      # runtime, so its own package.json version must always track the .NET package's version -
      # nbgv only versions .NET projects, so this reads it back from the nupkg this job just
      # packed rather than invoking nbgv again.
      - name: Stamp npm package version
        id: npm-version
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem ./artifacts -Recurse -Filter 'DotnetEfCoreMcp.Server.*.nupkg' |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Select-Object -First 1
          if (-not $nupkg) {
            throw "Could not find the DotnetEfCoreMcp.Server nupkg to determine the package version."
          }
          if ($nupkg.Name -notmatch '^DotnetEfCoreMcp\.Server\.(?<version>\d+\.\d+\.\d+(?:[-+].+)?)\.nupkg$') {
            throw "Could not parse a version out of nupkg filename '$($nupkg.Name)'."
          }
          $version = $Matches['version']
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # npm 11+ refuses to publish a prerelease without an explicit dist-tag.
          $distTag = if ($version -match '-') { 'preview' } else { 'latest' }
          "dist-tag=$distTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $packageJsonPath = './npm/package.json'
          $json = Get-Content $packageJsonPath -Raw | ConvertFrom-Json
          $json.version = $version
          ($json | ConvertTo-Json -Depth 10) | Set-Content -Path $packageJsonPath
          Write-Host "Stamped $packageJsonPath with version $version"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"

      # GitHub Packages' npm registry only accepts scoped packages, so a copy of the wrapper is
      # renamed to @sommmen/dotnet-efcore-mcp and published there with the workflow token. A
      # project-level .npmrc routes the scope to npm.pkg.github.com, leaving the user-level
      # .npmrc written by setup-node (registry.npmjs.org) untouched for the step below.
      - name: Publish npm package to GitHub Packages
        id: npm-github-packages
        continue-on-error: true
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.npm-version.outputs.version }}
          DIST_TAG: ${{ steps.npm-version.outputs.dist-tag }}
        run: |
          $packageName = '@sommmen/dotnet-efcore-mcp'
          $registry = 'https://npm.pkg.github.com'
          $stagingDir = Join-Path $env:RUNNER_TEMP 'npm-github-packages'
          Remove-Item $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item ./npm $stagingDir -Recurse

          $packageJsonPath = Join-Path $stagingDir 'package.json'
          $json = Get-Content $packageJsonPath -Raw | ConvertFrom-Json
          $json.name = $packageName
          $json | Add-Member -NotePropertyName publishConfig -NotePropertyValue ([ordered]@{ registry = $registry }) -Force
          ($json | ConvertTo-Json -Depth 10) | Set-Content -Path $packageJsonPath

          @(
            "@sommmen:registry=$registry"
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
          ) | Set-Content -Path (Join-Path $stagingDir '.npmrc')

          Push-Location $stagingDir
          try {
            $existing = npm view "$packageName@$env:PACKAGE_VERSION" version 2>&1
            if ($LASTEXITCODE -eq 0 -and $existing) {
              Write-Host "$packageName@$env:PACKAGE_VERSION already exists on GitHub Packages; skipping."
              "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
            }
            if ($LASTEXITCODE -ne 0 -and "$existing" -notmatch 'E404') {
              Write-Warning "npm view failed for reasons other than the version being absent; attempting publish anyway: $existing"
            }
            npm publish --tag $env:DIST_TAG
            if ($LASTEXITCODE -ne 0) { throw "npm publish to GitHub Packages failed." }
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          finally {
            Pop-Location
          }

      # Publishing to the public npm registry is not yet enabled for this repo. This step is a
      # no-op until the NPM_TOKEN secret (an npm automation token with publish access for the
      # `dotnet-efcore-mcp` package) is configured, at which point every push to main also
      # publishes a matching preview build to npmjs.org.
      - name: Publish to npm
        if: env.NPM_TOKEN_SET == 'true'
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.npm-version.outputs.dist-tag }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"

      - name: Summarize published packages
        if: always()
        shell: pwsh
        env:
          NPM_VERSION: ${{ steps.npm-github-packages.outcome == 'success' && steps.npm-version.outputs.version || '' }}
        run: |
          $packages = Get-ChildItem ./artifacts -Recurse -Filter *.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            ForEach-Object {
              if ($_.Name -match '^(?<id>.+)\.(?<version>\d+\.\d+\.\d+(?:[-+].+)?)\.nupkg$') {
                "| $($Matches['id']) | $($Matches['version']) |"
              }
            }

          "## Published preview packages" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Package | Version |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| --- | --- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:NPM_VERSION) {
            $packages = @($packages) + "| @sommmen/dotnet-efcore-mcp (npm) | $env:NPM_VERSION |"
          }
          if ($packages) {
            $packages | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          else {
            "| _No package artifacts found_ | — |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: NuGet login (OIDC to temporary API key)
        if: >-
          ((github.event_name == 'release' && !github.event.release.prerelease) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_nuget))
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        if: steps.nuget-login.outputs.NUGET_API_KEY != ''
        env:
          NuGetDirectory: ./artifacts
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          }
